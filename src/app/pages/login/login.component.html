<app-header-profile
  username=""
  backLink="/"
  profileSrc="https://raw.githubusercontent.com/feathericons/feather/master/icons/arrow-left.svg"
  profileAlt="Index">
</app-header-profile>

<main class="login-page-wrapper">
  <div class="login-main-container">
    <div class="login-content-section">
      <div class="login-image-column">
        <img class="login-main-image"
          [src]="ui?.imageSrc || 'https://images.unsplash.com/photo-1616803140344-6682afb13cda?auto=format&fit=crop&q=80&w=800'"
          [alt]="ui?.imageAlt || 'Imagen Decorativa Imperium'">
      </div>
      <div class="login-form-column">
        <div class="login-form-card">
          <h1 class="login-title">{{ ui?.title || 'Te damos la bienvenida' }}</h1>
          <p class="login-subtitle">{{ ui?.subtitle || 'Introduce tu usuario y clave de acceso.' }}</p>

          <form (ngSubmit)="onSubmit()">
            <div class="form-group">
              <label for="usuario">{{ ui?.labelUser || 'Usuario' }}</label>
              <input type="text" id="usuario" name="usuario"
                [(ngModel)]="email"
                [placeholder]="ui?.placeholderUser || 'Email'" required>
            </div>

            <div class="form-group">
              <label for="password">{{ ui?.labelPass || 'Contraseña' }}</label>
              <div class="password-wrapper">
                <input [type]="showPassword ? 'text' : 'password'"
                  id="password" name="password"
                  [(ngModel)]="password" required>
                <span class="eye-icon" (click)="showPassword = !showPassword">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                    viewBox="0 0 24 24" fill="none" stroke="#888"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                </span>
              </div>
            </div>

            @if (errorMsg) {
              <p style="color:#d9534f; font-size:13px; margin-bottom:10px;">{{ errorMsg }}</p>
            }
            @if (cargando) {
              <p style="color:#888; font-size:13px; margin-bottom:10px;">Iniciando sesión...</p>
            }

            <button type="submit" class="btn-primary" [disabled]="cargando">
              {{ ui?.submitText || 'Entrar' }}
            </button>

            <div class="login-links">
              <a href="#">{{ ui?.linkForgot || '¿Olvidó la contraseña?' }}</a>
              <a routerLink="/registro">{{ ui?.linkSignup || '¿No eres cliente?' }}</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>

<app-footer></app-footer>
